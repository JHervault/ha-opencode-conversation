[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-opencode-conversation"
version = "0.1.0"
description = "Home Assistant Conversation agent backed by OpenCode Server"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [{name = "Jonathan Hervault"}]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
test = ["aiohttp>=3.11", "pytest>=8.0", "pytest-asyncio>=0.25", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["custom_components.opencode_conversation*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
